name: Profile README — stats + Pac-Man

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia às 03:00 (Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Card geral + linguagens (inclui repositórios PRIVADOS — exige o secret METRICS_TOKEN com escopo "repo")
      - name: Stats (públicos + privados)
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: GabrielSSGitb
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          repositories_affiliations: owner, collaborator
          config_timezone: America/Sao_Paulo
          committer_message: 'chore: update metrics [skip ci]'

  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pac-Man comendo o gráfico de contribuições (o token permite incluir contribuições privadas)
      - name: Gerar SVG do Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Publicar SVGs na branch "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
